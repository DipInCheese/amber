name: build-sidecars

# Builds idevice_id/idevicebackup2 (from libimobiledevice) as self-contained,
# relocatable sidecar bundles - a real exe/binary plus every DLL/dylib it
# needs, so they run standalone next to Amber's own executable with nothing
# else installed on the user's machine. Manually triggered (workflow_dispatch)
# for validating the process and producing artifacts to wire into
# resources/bin/; not part of the normal push/PR/release pipeline.
#
# Windows: libimobiledevice itself is built from its 1.4.0 source tag
# (MSYS2's own package repo is stuck on the last tagged release, 1.3.0 from
# 2020, which has a long-standing backup-protocol incompatibility with
# modern iOS - see the comment above the Windows build steps below). Its
# dependencies come from MSYS2's mingw-w64 package repo where those are
# already fresh enough (libplist, libimobiledevice-glue, libusbmuxd), plus
# libtatsu built from source (new in 1.4.0, not packaged by MSYS2 at all
# yet). The DLL closure is resolved with a file-based BFS queue over `ldd`
# output, so transitive dependencies (openssl, zlib, the mingw runtime,
# ...) are all included regardless of whether they came from pacman or our
# own source build. Uses MSYS2's bash directly as the step shell (via the
# `shell:` template) rather than shelling into it from cmd, to avoid
# nested-quoting bugs.
#
# macOS: libimobiledevice comes from Homebrew (pre-installed on macos-latest,
# which is Apple Silicon) - already on 1.4.0, no source build needed there.
# Dependency dylibs are found via `otool -L` and
# every reference is rewritten with `install_name_tool` to `@executable_path/...`
# so the binaries don't need Homebrew's install prefix to exist on an end
# user's Mac. The BFS queue is file-based (not a bash associative array),
# since macOS's default /bin/bash is 3.2 and doesn't support `declare -A`.
# Intel (x86_64-apple-darwin) isn't covered here yet - Homebrew doesn't
# natively cross-build for it on an Apple Silicon runner.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: 'C:\msys64\usr\bin\bash.exe -e {0}'
    steps:
      - name: Install build toolchain and libimobiledevice's dependencies
        run: |
          # Non-login, non-interactive bash.exe skips /etc/profile, so
          # MSYS2's own directories (where pacman lives) aren't on PATH by
          # default here - only what the Windows environment already had.
          export PATH="/usr/bin:/mingw64/bin:$PATH"
          pacman -Sy --noconfirm
          # NOT mingw-w64-x86_64-libimobiledevice itself - MSYS2's package
          # is pinned to upstream's last tagged release, 1.3.0 (2020), which
          # has a long-standing, still-open compatibility bug with the
          # backup protocol on modern iOS ("Could not perform backup
          # protocol version exchange, error code -1" - see
          # https://github.com/libimobiledevice/libimobiledevice/issues/1115
          # and similar). Upstream cut a new 1.4.0 release in Oct 2025 with
          # explicit "Fixes for idevicebackup2", but MSYS2's package repo
          # hasn't picked it up - so libimobiledevice itself gets built
          # from source below, from the real 1.4.0 tag. Everything it
          # depends on (checked against Homebrew's already-1.4.0-compatible
          # versions) is already fresh enough as a regular package: libplist
          # 2.7.0, libimobiledevice-glue 1.3.2, libusbmuxd 2.1.1.
          pacman -S --noconfirm \
            git make libtool autoconf automake-wrapper \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-pkg-config \
            mingw-w64-x86_64-openssl \
            mingw-w64-x86_64-libplist \
            mingw-w64-x86_64-libimobiledevice-glue \
            mingw-w64-x86_64-libusbmuxd \
            mingw-w64-x86_64-curl

      - name: Build libtatsu 1.0.5 from source
        run: |
          # New dependency as of libimobiledevice 1.4.0 (Apple services
          # auth) - not packaged by MSYS2 at all yet, unlike the others
          # above. --prefix=/mingw64 installs it flat alongside everything
          # pacman already manages, so pkg-config finds it with zero extra
          # configuration and the existing DLL-closure walk below picks up
          # libtatsu-1.0.dll the same way it would any pacman package.
          export PATH="/usr/bin:/mingw64/bin:$PATH"
          git -c core.autocrlf=false clone --branch 1.0.5 --depth 1 https://github.com/libimobiledevice/libtatsu.git /tmp/libtatsu
          cd /tmp/libtatsu
          ./autogen.sh CC=gcc CXX=g++ --prefix=/mingw64
          make
          make install

      - name: Build libimobiledevice 1.4.0 from source and resolve the DLL closure
        run: |
          export PATH="/usr/bin:/mingw64/bin:$PATH"
          git -c core.autocrlf=false clone --branch 1.4.0 --depth 1 https://github.com/libimobiledevice/libimobiledevice.git /tmp/libimobiledevice
          cd /tmp/libimobiledevice
          ./autogen.sh CC=gcc CXX=g++ --prefix=/mingw64
          make
          make install

          out=/c/sidecar-out
          mkdir -p "$out"
          worklist="$out/.worklist"
          seen="$out/.seen"
          : > "$worklist"
          : > "$seen"

          enqueue() {
            base="$(basename "$1")"
            if ! grep -qxF "$base" "$seen" 2>/dev/null; then
              echo "$base" >> "$seen"
              echo "$1" >> "$worklist"
            fi
          }

          enqueue /mingw64/bin/idevice_id.exe
          enqueue /mingw64/bin/idevicebackup2.exe

          while [ -s "$worklist" ]; do
            f="$(head -n1 "$worklist")"
            sed -i '1d' "$worklist"
            base="$(basename "$f")"
            dest="$out/$base"
            [ -f "$dest" ] || cp "$f" "$dest"
            for dll in $(ldd "$dest" 2>/dev/null | grep -i '=> /mingw64' | awk '{print $3}'); do
              enqueue "$dll"
            done
          done
          rm -f "$worklist" "$seen"

          echo "--- resolved closure ---"
          ls -la "$out"
          echo "--- final ldd check (no more /mingw64 refs should be missing) ---"
          for f in "$out"/*.exe; do echo "$f:"; ldd "$f"; done

      - name: Smoke test - run the sidecar standalone (nothing else on PATH)
        shell: bash
        run: |
          cd /c/sidecar-out
          # Deliberately not sourcing MSYS2's environment here, to prove
          # these binaries are self-contained.
          ./idevice_id.exe --version || echo "exit code: $?"
          ./idevicebackup2.exe --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-windows-x86_64
          path: C:\sidecar-out\*

  macos:
    runs-on: macos-latest
    steps:
      - name: Install libimobiledevice (Homebrew)
        run: brew install libimobiledevice

      - name: Collect binaries and relink dylibs
        run: |
          set -eu
          out="$PWD/sidecar-out"
          mkdir -p "$out"
          PREFIX="$(brew --prefix libimobiledevice)"

          # The two entry points are externalBin sidecars, which Tauri
          # places in Contents/MacOS/ (next to the main executable) -
          # `@executable_path` resolves there. Everything they depend on is
          # a `resources` entry instead (externalBin is for one executable
          # per logical name, not arbitrary shared libraries), which Tauri
          # places in Contents/Resources/ - a *different* directory, so the
          # two executables must reference dylibs via
          # `@executable_path/../Resources/<dylib>`, not `@executable_path/<dylib>`.
          # The dylibs sit alongside each other in that same flat Resources
          # dir, so dylib-to-dylib references use the simpler,
          # location-relative `@loader_path/<dylib>`.
          worklist="$out/.worklist"
          seenfile="$out/.seen"
          : > "$worklist"
          : > "$seenfile"

          enqueue() {
            base="$(basename "$1")"
            kind="$2"
            if ! grep -qxF "$base" "$seenfile" 2>/dev/null; then
              echo "$base" >> "$seenfile"
              echo "$1|$base|$kind" >> "$worklist"
            fi
          }

          enqueue "$PREFIX/bin/idevice_id" exe
          enqueue "$PREFIX/bin/idevicebackup2" exe

          while [ -s "$worklist" ]; do
            line="$(head -n1 "$worklist")"
            sed -i '' '1d' "$worklist"
            src="${line%%|*}"
            rest="${line#*|}"
            base="${rest%%|*}"
            kind="${rest##*|}"
            dest="$out/$base"
            if [ ! -f "$dest" ]; then
              cp "$src" "$dest"
              chmod +w "$dest"
              if [ "$kind" = "lib" ]; then
                install_name_tool -id "@loader_path/$base" "$dest"
              fi
            fi
            if [ "$kind" = "exe" ]; then
              rewrite_prefix="@executable_path/../Resources"
            else
              rewrite_prefix="@loader_path"
            fi
            for dep in $(otool -L "$dest" | tail -n +2 | awk '{print $1}'); do
              case "$dep" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) continue ;;
              esac
              enqueue "$dep" lib
              depbase="$(basename "$dep")"
              install_name_tool -change "$dep" "$rewrite_prefix/$depbase" "$dest"
            done
          done
          rm -f "$worklist" "$seenfile"

          echo "--- resolved closure ---"
          ls -la "$out"
          echo "--- final otool -L check (no /opt/homebrew or /usr/local refs should remain) ---"
          for f in "$out"/*; do echo "$f:"; otool -L "$f"; done

      - name: Smoke test - reproduce the real .app layout and run standalone
        run: |
          set -eu
          # Mirror Contents/MacOS + Contents/Resources so the
          # @executable_path/../Resources and @loader_path references
          # resolve exactly as they will in the installed .app.
          mkdir -p app-layout/Contents/MacOS app-layout/Contents/Resources
          cp sidecar-out/idevice_id sidecar-out/idevicebackup2 app-layout/Contents/MacOS/
          for f in sidecar-out/*.dylib; do
            cp "$f" app-layout/Contents/Resources/
          done
          cd app-layout/Contents/MacOS
          ./idevice_id --version || echo "exit code: $?"
          ./idevicebackup2 --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-macos-aarch64
          path: sidecar-out/*
