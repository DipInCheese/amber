name: build-sidecars

# Builds idevice_id/idevicebackup2 (from libimobiledevice) as self-contained,
# relocatable sidecar bundles - a real exe/binary plus every DLL/dylib it
# needs, so they run standalone next to Amber's own executable with nothing
# else installed on the user's machine. Manually triggered (workflow_dispatch)
# for validating the process and producing artifacts to wire into
# resources/bin/; not part of the normal push/PR/release pipeline.
#
# Windows: libimobiledevice comes from MSYS2's mingw-w64 package repo
# (MSYS2 is pre-installed on windows-latest runners). The DLL closure is
# resolved with a file-based BFS queue over `ldd` output, so transitive
# dependencies (openssl, zlib, the mingw runtime, ...) are all included.
# Uses MSYS2's bash directly as the step shell (via the `shell:` template)
# rather than shelling into it from cmd, to avoid nested-quoting bugs.
#
# macOS: libimobiledevice comes from Homebrew (pre-installed on macos-latest,
# which is Apple Silicon). Dependency dylibs are found via `otool -L` and
# every reference is rewritten with `install_name_tool` to `@executable_path/...`
# so the binaries don't need Homebrew's install prefix to exist on an end
# user's Mac. The BFS queue is file-based (not a bash associative array),
# since macOS's default /bin/bash is 3.2 and doesn't support `declare -A`.
# Intel (x86_64-apple-darwin) isn't covered here yet - Homebrew doesn't
# natively cross-build for it on an Apple Silicon runner.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: 'C:\msys64\usr\bin\bash.exe -e {0}'
    steps:
      - name: Install libimobiledevice and resolve the DLL closure
        run: |
          export PATH="/mingw64/bin:$PATH"
          pacman -Sy --noconfirm
          pacman -S --noconfirm mingw-w64-x86_64-libimobiledevice

          out=/c/sidecar-out
          mkdir -p "$out"
          worklist="$out/.worklist"
          seen="$out/.seen"
          : > "$worklist"
          : > "$seen"

          enqueue() {
            base="$(basename "$1")"
            if ! grep -qxF "$base" "$seen" 2>/dev/null; then
              echo "$base" >> "$seen"
              echo "$1" >> "$worklist"
            fi
          }

          enqueue /mingw64/bin/idevice_id.exe
          enqueue /mingw64/bin/idevicebackup2.exe

          while [ -s "$worklist" ]; do
            f="$(head -n1 "$worklist")"
            sed -i '1d' "$worklist"
            base="$(basename "$f")"
            dest="$out/$base"
            [ -f "$dest" ] || cp "$f" "$dest"
            for dll in $(ldd "$dest" 2>/dev/null | grep -i '=> /mingw64' | awk '{print $3}'); do
              enqueue "$dll"
            done
          done
          rm -f "$worklist" "$seen"

          echo "--- resolved closure ---"
          ls -la "$out"
          echo "--- final ldd check (no more /mingw64 refs should be missing) ---"
          for f in "$out"/*.exe; do echo "$f:"; ldd "$f"; done

      - name: Smoke test - run the sidecar standalone (nothing else on PATH)
        shell: bash
        run: |
          cd /c/sidecar-out
          # Deliberately not sourcing MSYS2's environment here, to prove
          # these binaries are self-contained.
          ./idevice_id.exe --version || echo "exit code: $?"
          ./idevicebackup2.exe --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-windows-x86_64
          path: C:\sidecar-out\*

  macos:
    runs-on: macos-latest
    steps:
      - name: Install libimobiledevice (Homebrew)
        run: brew install libimobiledevice

      - name: Collect binaries and relink dylibs to @executable_path
        run: |
          set -eu
          out="$PWD/sidecar-out"
          mkdir -p "$out"
          PREFIX="$(brew --prefix libimobiledevice)"

          worklist="$out/.worklist"
          seenfile="$out/.seen"
          : > "$worklist"
          : > "$seenfile"

          enqueue() {
            base="$(basename "$1")"
            if ! grep -qxF "$base" "$seenfile" 2>/dev/null; then
              echo "$base" >> "$seenfile"
              echo "$1|$base" >> "$worklist"
            fi
          }

          enqueue "$PREFIX/bin/idevice_id"
          enqueue "$PREFIX/bin/idevicebackup2"

          while [ -s "$worklist" ]; do
            line="$(head -n1 "$worklist")"
            sed -i '' '1d' "$worklist"
            src="${line%%|*}"
            base="${line##*|}"
            dest="$out/$base"
            if [ ! -f "$dest" ]; then
              cp "$src" "$dest"
              chmod +w "$dest"
              install_name_tool -id "@executable_path/$base" "$dest"
            fi
            for dep in $(otool -L "$dest" | tail -n +2 | awk '{print $1}'); do
              case "$dep" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) continue ;;
              esac
              enqueue "$dep"
              depbase="$(basename "$dep")"
              install_name_tool -change "$dep" "@executable_path/$depbase" "$dest"
            done
          done
          rm -f "$worklist" "$seenfile"

          echo "--- resolved closure ---"
          ls -la "$out"
          echo "--- final otool -L check (no /opt/homebrew or /usr/local refs should remain) ---"
          for f in "$out"/*; do echo "$f:"; otool -L "$f"; done

      - name: Smoke test - run the sidecar standalone
        run: |
          cd sidecar-out
          ./idevice_id --version || echo "exit code: $?"
          ./idevicebackup2 --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-macos-aarch64
          path: sidecar-out/*
