name: build-sidecars

# Builds idevice_id/idevicebackup2 (from libimobiledevice) as self-contained,
# relocatable sidecar bundles - a real exe/binary plus every DLL/dylib it
# needs, so they run standalone next to Amber's own executable with nothing
# else installed on the user's machine. Manually triggered (workflow_dispatch)
# for validating the process and producing artifacts to wire into
# resources/bin/; not part of the normal push/PR/release pipeline.
#
# Windows: libimobiledevice comes from MSYS2's mingw-w64 package repo
# (MSYS2 is pre-installed on windows-latest runners). The DLL closure is
# resolved by walking `ldd` output breadth-first so transitive dependencies
# (openssl, zlib, the mingw runtime, ...) are all included.
#
# macOS: libimobiledevice comes from Homebrew (pre-installed on macos-latest,
# which is Apple Silicon). Dependency dylibs are found via `otool -L` and
# every reference is rewritten with `install_name_tool` to `@executable_path/...`
# so the binaries don't need Homebrew's install prefix to exist on an end
# user's Mac. Intel (x86_64-apple-darwin) isn't covered here yet - Homebrew
# doesn't natively cross-build for it on an Apple Silicon runner.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Prepare output directory
        shell: bash
        run: mkdir -p /c/sidecar-out

      - name: Install libimobiledevice (MSYS2/mingw-w64) and resolve the DLL closure
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "MSYSTEM=MINGW64 /c/msys64/usr/bin/bash.exe -lc '\
            set -euo pipefail; \
            pacman -Sy --noconfirm; \
            pacman -S --noconfirm mingw-w64-x86_64-libimobiledevice; \
            cp /mingw64/bin/idevice_id.exe /c/sidecar-out/; \
            cp /mingw64/bin/idevicebackup2.exe /c/sidecar-out/; \
            declare -A seen; \
            worklist=(/c/sidecar-out/idevice_id.exe /c/sidecar-out/idevicebackup2.exe); \
            while [ ${#worklist[@]} -gt 0 ]; do \
              f=\"${worklist[0]}\"; \
              worklist=(\"${worklist[@]:1}\"); \
              for dll in $(ldd \"$f\" 2>/dev/null | grep -i \"=> /mingw64\" | awk \"{print \\$3}\"); do \
                base=$(basename \"$dll\"); \
                if [ -z \"${seen[$base]:-}\" ]; then \
                  seen[$base]=1; \
                  cp \"$dll\" /c/sidecar-out/; \
                  worklist+=(\"/c/sidecar-out/$base\"); \
                fi; \
              done; \
            done; \
            echo \"--- resolved closure ---\"; \
            ls -la /c/sidecar-out; \
            echo \"--- final ldd check (no more /mingw64 refs should be missing) ---\"; \
            for f in /c/sidecar-out/*.exe; do echo \"$f:\"; ldd \"$f\"; done \
          '"

      - name: Smoke test - run the sidecar standalone (nothing else on PATH)
        shell: bash
        run: |
          cd /c/sidecar-out
          # Deliberately not sourcing MSYS2's environment here, to prove
          # these binaries are self-contained.
          ./idevice_id.exe --version || echo "exit code: $?"
          ./idevicebackup2.exe --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-windows-x86_64
          path: C:\sidecar-out\*

  macos:
    runs-on: macos-latest
    steps:
      - name: Install libimobiledevice (Homebrew)
        run: brew install libimobiledevice

      - name: Collect binaries and relink dylibs to @executable_path
        run: |
          set -euo pipefail
          mkdir -p sidecar-out
          PREFIX="$(brew --prefix libimobiledevice)"
          cp "$PREFIX/bin/idevice_id" sidecar-out/
          cp "$PREFIX/bin/idevicebackup2" sidecar-out/
          chmod +w sidecar-out/*

          declare -A seen
          worklist=(sidecar-out/idevice_id sidecar-out/idevicebackup2)
          while [ ${#worklist[@]} -gt 0 ]; do
            f="${worklist[0]}"
            worklist=("${worklist[@]:1}")
            for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}'); do
              case "$dep" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) continue ;;
              esac
              base="$(basename "$dep")"
              if [ -z "${seen[$base]:-}" ]; then
                seen[$base]=1
                cp "$dep" "sidecar-out/$base"
                chmod +w "sidecar-out/$base"
                install_name_tool -id "@executable_path/$base" "sidecar-out/$base"
                worklist+=("sidecar-out/$base")
              fi
              install_name_tool -change "$dep" "@executable_path/$base" "$f"
            done
          done

          echo "--- resolved closure ---"
          ls -la sidecar-out
          echo "--- final otool -L check (no /opt/homebrew or /usr/local refs should remain) ---"
          for f in sidecar-out/*; do echo "$f:"; otool -L "$f"; done

      - name: Smoke test - run the sidecar standalone
        run: |
          cd sidecar-out
          ./idevice_id --version || echo "exit code: $?"
          ./idevicebackup2 --version || echo "exit code: $?"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecars-macos-aarch64
          path: sidecar-out/*
