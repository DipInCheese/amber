[package]
name = "amber-desktop"
version.workspace = true
description = "Amber - a local-first iMessage/SMS archiver and viewer"
authors = ["Amber contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
amber-core.workspace = true
amber-format.workspace = true
amber-ingest.workspace = true
tempfile.workspace = true
tauri-plugin-shell = "2"
imagesize = "0.15.0"

# HEIC -> JPEG for display (src/heic.rs): WebView2 can't decode HEIC, but the
# Windows Imaging Component can once the HEIF extension is installed. Same
# version tauri already pulls in, so no second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

